services:
  openclaw:
    image: openclaw/openclaw:latest
    extra_hosts:
      # Routes host.docker.internal → host machine so openclaw can reach the host's Ollama
      - "host.docker.internal:host-gateway"
    environment:
      # Required for local/LAN Ollama hosts (any value works)
      - OLLAMA_API_KEY=ollama-local
      # Point directly to config file (avoids HOME path ambiguity in the container)
      - OPENCLAW_CONFIG_PATH=/config/openclaw.json
      # Gateway auth token (required when binding to non-loopback address in container)
      - OPENCLAW_GATEWAY_TOKEN=demo-token-lab
    volumes:
      - ./openclaw-workspace:/workspace
      - ./openclaw-config/openclaw.json:/config/openclaw.json:ro
    tty: true
    stdin_open: true

  mock-web:
    image: nginx:alpine
    volumes:
      - ./mock-web:/usr/share/nginx/html:ro

  attacker-server:
    build:
      context: ./attacker-server
    ports:
      - "8080:8080"
    volumes:
      - ./attacker-server:/app
